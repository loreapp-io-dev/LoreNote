name: Release

on:
  push:
    tags:
      - 'v*' # 当推送 v* 标签时触发（如 v0.2.0）
  workflow_dispatch: # 允许手动触发

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LoreNote ${{ github.ref_name }}'
          releaseBody: |
            ## 🎉 What's New in ${{ github.ref_name }}

            ### ✨ Features
            - New feature descriptions here

            ### 🐛 Bug Fixes
            - Bug fix descriptions here

            ### 📦 Downloads

            Choose the installer for your platform:

            | Platform | File | Description |
            |----------|------|-------------|
            | 🍎 macOS (Apple Silicon) | `LoreNote_*_aarch64.dmg` | For M1/M2/M3 Macs |
            | 🍎 macOS (Intel) | `LoreNote_*_x64.dmg` | For Intel Macs |
            | 🐧 Linux (Debian/Ubuntu) | `lore-note_*_amd64.deb` | .deb package |
            | 🐧 Linux (Universal) | `lore-note_*_amd64.AppImage` | Portable AppImage |
            | 🪟 Windows | `LoreNote_*_x64-setup.exe` | Installer |
            | 🪟 Windows | `LoreNote_*_x64.msi` | MSI package |

            ### 📝 Full Changelog

            See all changes: https://github.com/loreapp-io-dev/LoreNote/compare/v0.1.0...${{ github.ref_name }}

            ---

            **Note**: First time installing? Check our [installation guide](https://github.com/loreapp-io-dev/LoreNote#for-developers).
          releaseDraft: false
          prerelease: false

